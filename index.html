<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Generator</title>
<style>
  :root { --bg:#121212; --panel:#181818; --line:#282828; --text:#e8e8e8;
          --muted:#9a9a9a; --green:#1db954; --red:#e0554e; --orange:#e0a44e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; font-weight:700; }
  header p { margin:4px 0 0; color:var(--muted); font-size:12px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end;
              padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  input[type=text], input[type=number] { background:#0e0e0e; border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:8px 10px; font-size:14px; }
  input[type=text] { min-width:200px; }
  input[type=number] { width:80px; }
  .checks { display:flex; gap:14px; align-items:center; }
  .checks label { font-size:13px; color:var(--text); text-transform:none; letter-spacing:0; }
  button { border:none; border-radius:20px; padding:9px 18px; font-size:14px;
           font-weight:600; cursor:pointer; }
  #start { background:var(--green); color:#000; }
  #stop  { background:#333; color:var(--text); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .status { margin-left:auto; font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
         background:var(--muted); margin-right:6px; vertical-align:middle; }
  .dot.running { background:var(--green); animation:pulse 1s infinite; }
  .dot.error { background:var(--red); } .dot.complete { background:var(--green); }
  .dot.stopped { background:var(--orange); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  main { display:grid; grid-template-columns:1fr 380px; gap:0; height:calc(100vh - 132px); }
  @media (max-width:820px){ main{ grid-template-columns:1fr; height:auto; } }
  #console { overflow:auto; padding:14px 18px; font:12.5px/1.6 SFMono-Regular,Menlo,monospace;
             white-space:pre-wrap; word-break:break-word; }
  #console .added  { color:var(--green); }
  #console .miss   { color:var(--orange); }
  #console .error  { color:var(--red); }
  #console .below, #console .duplicate { color:var(--muted); }
  #console .search, #console .progress, #console .summary, #console .done { color:#7fbfff; }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:14px;
          display:flex; flex-direction:column; gap:10px; }
  aside .head { display:flex; align-items:center; justify-content:space-between; }
  aside h2 { margin:0; font-size:13px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em; }
  aside button.refresh { background:#2a2a2a; color:var(--text); padding:4px 10px; font-size:12px; border-radius:14px; }
  .player-state { color:var(--muted); font-size:13px; text-align:center; padding:44px 16px;
                  border:1px dashed var(--line); border-radius:12px; display:flex;
                  flex-direction:column; align-items:center; gap:12px; line-height:1.5; }
  .player-state .icon { font-size:30px; opacity:.85; }
  .spinner { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--green);
             border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe { border:0; border-radius:12px; width:100%; height:420px; }
</style>
</head>
<body>
<header>
  <h1>🎵 Playlist Generator</h1>
  <p>Give a term, watch songs get matched by their lyrics, and hear the playlist build.</p>
</header>

<div class="controls">
  <div class="field">
    <label for="query" title="Comma-separate several terms; each is searched, all are matched">Search terms</label>
    <input type="text" id="query" placeholder="e.g. kristen, kristin, bonds, pocket" value="">
  </div>
  <div class="field">
    <label for="title">Playlist title</label>
    <input type="text" id="title" placeholder="(defaults to the term)">
  </div>
  <div class="field">
    <label for="threshold">Threshold %</label>
    <input type="number" id="threshold" value="3.0" step="0.1" min="0">
  </div>
  <div class="field">
    <label title="Lyrics always come from Genius; these pick how songs are discovered">Discover with</label>
    <div class="checks">
      <label><input type="checkbox" id="spotify" checked> Spotify search</label>
      <label><input type="checkbox" id="genius" checked> Genius search</label>
    </div>
  </div>
  <button id="start">▶ Start</button>
  <button id="stop" disabled>⏹ Stop</button>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
</div>

<main>
  <div id="console"></div>
  <aside>
    <div class="head">
      <h2>Spotify Player</h2>
      <button class="refresh" id="refresh" disabled>↻ refresh</button>
    </div>
    <div id="playerWrap"></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let cursor = 0, polling = null, playlistId = null, playerMounted = false;

const PLAYER_STATES = {
  idle: '<div class="player-state"><div class="icon">🎧</div>'
      + '<div>Your playlist player appears here.<br>Hit <b>Start</b> to begin.</div></div>',
  warming: '<div class="player-state"><div class="spinner"></div>'
      + '<div>Building your playlist…<br>the player loads when the first track lands.</div></div>',
  empty: '<div class="player-state"><div class="icon">🕳️</div>'
      + '<div>No songs were added.<br>Try a lower threshold or another term.</div></div>',
};
function renderPlayer(state) { $("playerWrap").innerHTML = PLAYER_STATES[state]; }

function setStatus(s) {
  $("statusText").textContent = s;
  $("dot").className = "dot " + (["running","complete","stopped","error"].includes(s) ? s : "");
}

function line(ev) {
  const div = document.createElement("div");
  // 'evaluate' events color by verdict (below/match); others by kind.
  let cls = ev.kind;
  if (ev.kind === "evaluate") cls = ev.verdict === "MATCH" ? "added" : "below";
  div.className = cls;
  div.textContent = ev.message || JSON.stringify(ev);
  const c = $("console");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  c.appendChild(div);
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function embedSrc(id) {
  // Cache-busting timestamp so the embed reloads with the playlist's current
  // tracks -- Spotify caches the embed, and reusing the same URL won't refresh.
  return "https://open.spotify.com/embed/playlist/" + id +
         "?utm_source=generator&t=" + Date.now();
}

function mountPlayer() {
  // Only mount the real embed once the playlist actually has a track --
  // an empty Spotify playlist embed renders as a broken-looking blank.
  if (playerMounted || !playlistId) return;
  $("playerWrap").innerHTML =
    '<iframe src="' + embedSrc(playlistId) + '" allow="encrypted-media" loading="lazy"></iframe>';
  playerMounted = true;
  $("refresh").disabled = false;
}

function refreshPlayer() {
  if (!playlistId) return;
  const f = document.querySelector("#playerWrap iframe");
  if (f) f.src = embedSrc(playlistId); // fresh timestamp forces a real reload
}

async function poll() {
  const r = await fetch("/api/events?cursor=" + cursor);
  const data = await r.json();
  cursor = data.cursor;
  let done = false;
  for (const ev of data.events) {
    line(ev);
    if (ev.kind === "playlist") {
      playlistId = ev.playlist_id;
      // Non-empty already (a re-run against an existing playlist) -> mount now.
      if (ev.track_count > 0) mountPlayer();
      else if (!playerMounted) renderPlayer("warming");
    }
    // A new add OR a duplicate both mean the playlist has at least one track.
    if (ev.kind === "added" || ev.kind === "duplicate") mountPlayer();
    if (ev.kind === "done") { done = true; setStatus(ev.status || "complete"); }
  }
  // Fallback if the playlist id only arrives at the top level.
  if (data.playlist_id && !playlistId) {
    playlistId = data.playlist_id;
    if (!playerMounted) renderPlayer("warming");
  }
  if (done) {
    finish();
    if (playerMounted) refreshPlayer();
    else renderPlayer("empty");
  } else {
    setStatus(data.status);
  }
}

function finish() {
  clearInterval(polling); polling = null;
  $("start").disabled = false;
  $("stop").disabled = true;
}

async function start() {
  const body = {
    query: $("query").value.trim(),
    title: $("title").value.trim() || null,
    threshold: parseFloat($("threshold").value),
    spotify: $("spotify").checked,
    genius: $("genius").checked,
  };
  if (!body.query) { alert("Enter a search term first."); return; }
  $("console").innerHTML = ""; cursor = 0; playlistId = null; playerMounted = false;
  renderPlayer("idle"); $("refresh").disabled = true;
  $("start").disabled = true; $("stop").disabled = false;
  setStatus("running");
  const r = await fetch("/api/run", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    line({kind:"error", message:"Could not start: " + (e.detail || r.status)});
    finish(); setStatus("error"); return;
  }
  polling = setInterval(poll, 400);
}

async function stop() {
  $("stop").disabled = true;
  await fetch("/api/stop", {method: "POST"});
}

$("start").onclick = start;
$("stop").onclick = stop;
$("refresh").onclick = refreshPlayer;
$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

renderPlayer("idle");  // cold-start state on first load
</script>
</body>
</html>
