<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Generator</title>
<style>
  :root { --bg:#121212; --panel:#181818; --line:#282828; --text:#e8e8e8;
          --muted:#9a9a9a; --green:#1db954; --red:#e0554e; --orange:#e0a44e; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; font-weight:700; }
  header p { margin:4px 0 0; color:var(--muted); font-size:12px; }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 20px 0; background:var(--panel); }
  .modes { display:flex; gap:4px; }
  .mode { background:transparent; color:var(--muted); border-radius:8px 8px 0 0;
          padding:8px 14px; border-bottom:2px solid transparent; }
  .mode.active { color:var(--text); border-bottom-color:var(--green); }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end;
              padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  .field.grow { flex:1 1 320px; }
  .source { flex:1 1 100%; display:flex; gap:10px; align-items:end; }
  textarea { background:#0e0e0e; border:1px solid var(--line); color:var(--text);
             border-radius:6px; padding:8px 10px; resize:vertical; width:100%;
             font:12.5px/1.5 SFMono-Regular,Menlo,monospace; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  input[type=text], input[type=number] { background:#0e0e0e; border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:8px 10px; font-size:14px; }
  input[type=text] { min-width:200px; }
  input[type=number] { width:80px; }
  .checks { display:flex; gap:14px; align-items:center; }
  .checks label { font-size:13px; color:var(--text); text-transform:none; letter-spacing:0; }
  button { border:none; border-radius:20px; padding:9px 18px; font-size:14px;
           font-weight:600; cursor:pointer; }
  .primary { background:var(--green); color:#000; }
  .secondary, #stop { background:#333; color:var(--text); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .status { margin-left:auto; font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
         background:var(--muted); margin-right:6px; vertical-align:middle; }
  .dot.running { background:var(--green); animation:pulse 1s infinite; }
  .dot.error { background:var(--red); } .dot.complete { background:var(--green); }
  .dot.stopped { background:var(--orange); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  main { display:grid; grid-template-columns:1fr 380px; gap:0; flex:1; min-height:0; }
  @media (max-width:820px){ body{ height:auto; min-height:100vh; }
                            main{ grid-template-columns:1fr; } }
  #console { overflow:auto; padding:14px 18px; font:12.5px/1.6 SFMono-Regular,Menlo,monospace;
             white-space:pre-wrap; word-break:break-word; }
  #console .added, #console .found { color:var(--green); }
  #console .miss   { color:var(--orange); }
  #console .error  { color:var(--red); }
  #console .below, #console .duplicate { color:var(--muted); }
  #console .tempo { color:var(--text); }
  #console .search, #console .progress, #console .reorder, #console .summary, #console .done,
  #console .playlist { color:#7fbfff; }
  #needs { padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  #needs h3 { margin:0 0 8px; font-size:13px; }
  #needs .need { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:4px 0; }
  #needs .need .name { flex:1 1 260px; }
  #needs .need .why { color:var(--orange); font-size:12px; }
  #needs button.pick { background:#2a2a2a; color:var(--text); padding:4px 12px; font-size:12px; }
  #needs .actions { display:flex; gap:10px; align-items:center; margin-top:10px; }
  #needs .actions span { color:var(--muted); font-size:12px; }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:14px;
          display:flex; flex-direction:column; gap:10px; }
  aside .head { display:flex; align-items:center; justify-content:space-between; }
  aside h2 { margin:0; font-size:13px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em; }
  aside button.refresh { background:#2a2a2a; color:var(--text); padding:4px 10px; font-size:12px; border-radius:14px; }
  .player-state { color:var(--muted); font-size:13px; text-align:center; padding:44px 16px;
                  border:1px dashed var(--line); border-radius:12px; display:flex;
                  flex-direction:column; align-items:center; gap:12px; line-height:1.5; }
  .player-state .icon { font-size:30px; opacity:.85; }
  .spinner { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--green);
             border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe { border:0; border-radius:12px; width:100%; height:420px; }
</style>
</head>
<body>
<header>
  <h1>🎵 Playlist Generator</h1>
  <p>Give a term, watch songs get matched by their lyrics, and hear the playlist build.</p>
</header>

<div class="bar">
  <div class="modes">
    <button class="mode active" id="modeSearch">Search lyrics</button>
    <button class="mode" id="modeList">Track list</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
  <button id="stop" disabled>⏹ Stop</button>
</div>

<div class="controls" id="searchControls">
  <div class="field">
    <label for="query" title="Comma-separate several terms; each is searched, all are matched">Search terms</label>
    <input type="text" id="query" placeholder="e.g. kristen, kristin, bonds, pocket" value="">
  </div>
  <div class="field">
    <label for="title">Playlist title</label>
    <input type="text" id="title" placeholder="(defaults to the term)">
  </div>
  <div class="field">
    <label for="threshold">Threshold %</label>
    <input type="number" id="threshold" value="3.0" step="0.1" min="0">
  </div>
  <div class="field">
    <label title="Lyrics always come from Genius; these pick how songs are discovered">Discover with</label>
    <div class="checks">
      <label><input type="checkbox" id="spotify" checked> Spotify search</label>
      <label><input type="checkbox" id="genius" checked> Genius search</label>
    </div>
  </div>
  <button id="start" class="primary go">▶ Start</button>
</div>

<div class="controls" id="listControls" hidden>
  <div class="source">
    <div class="field grow">
      <label for="sourceLink" title="Loads that playlist's tracks into the box below, in order, so you can rearrange them">Start from an existing playlist (optional)</label>
      <input type="text" id="sourceLink" placeholder="Paste a Spotify playlist link">
    </div>
    <button id="loadList" class="secondary">Load tracks</button>
  </div>
  <div class="field grow">
    <label for="tracks" title="Artist - Title works too; numbering and blank lines are ignored">Tracks, one per line, in the order you want</label>
    <textarea id="tracks" rows="6" placeholder="Title - Artist&#10;Title - Artist&#10;..."></textarea>
  </div>
  <div class="field">
    <label for="listTitle">Playlist title</label>
    <input type="text" id="listTitle" placeholder="e.g. Bike ride">
  </div>
  <button id="createList" class="primary go">▶ Create playlist</button>
  <button id="checkList" class="secondary go" title="Look the tracks up without creating a playlist">Check only</button>
  <button id="reorderList" class="secondary go" title="Put the tracks in an order that flows by tempo and key. Changes only the box above, nothing on Spotify">Reorder by tempo + key</button>
</div>

<div id="needs" hidden>
  <h3 id="needsTitle"></h3>
  <div id="needsRows"></div>
  <div class="actions">
    <button id="applyTempos" class="primary go">Reorder again</button>
    <button id="undoReorder" class="secondary">Undo reorder</button>
    <button id="forgetTempos" class="secondary" title="Clear every tempo you have typed in">Forget my tempos</button>
    <span id="temposNote"></span>
  </div>
</div>

<main>
  <div id="console"></div>
  <aside>
    <div class="head">
      <h2>Spotify Player</h2>
      <button class="refresh" id="refresh" disabled>↻ refresh</button>
    </div>
    <div id="playerWrap"></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let cursor = 0, polling = null, playlistId = null, playerMounted = false;
let emptyState = "empty";  // which player message to show if a run ends with no playlist
const known = {};          // line -> Spotify track id, for tracks loaded from a playlist
let beforeReorder = null;  // the box's text before the last reorder, for Undo

// Tempos you typed in for tracks the services don't know, kept in this browser.
const tempoKey = (text) => text.toLowerCase().split(/\s+/).filter(Boolean).join(" ");
function loadTempos() {
  try { return JSON.parse(localStorage.getItem("tempos") || "{}") || {}; } catch (e) { return {}; }
}
function saveTempos(tempos) {
  try { localStorage.setItem("tempos", JSON.stringify(tempos)); } catch (e) { /* still works this run */ }
}
let myTempos = loadTempos();

const PLAYER_STATES = {
  idle: '<div class="player-state"><div class="icon">🎧</div>'
      + '<div>Your playlist player appears here.<br>Hit <b>Start</b> to begin.</div></div>',
  warming: '<div class="player-state"><div class="spinner"></div>'
      + '<div>Building your playlist…<br>the player loads when the first track lands.</div></div>',
  empty: '<div class="player-state"><div class="icon">🕳️</div>'
      + '<div>No songs were added.<br>Try a lower threshold or another term.</div></div>',
  noPlaylist: '<div class="player-state"><div class="icon">📋</div>'
      + '<div>No playlist was created.<br>See the console for what was found.</div></div>',
};
function renderPlayer(state) { $("playerWrap").innerHTML = PLAYER_STATES[state]; }

function setStatus(s) {
  $("statusText").textContent = s;
  $("dot").className = "dot " + (["running","complete","stopped","error"].includes(s) ? s : "");
}

function line(ev) {
  const div = document.createElement("div");
  // 'evaluate' events color by verdict (below/match); others by kind.
  let cls = ev.kind;
  if (ev.kind === "evaluate") cls = ev.verdict === "MATCH" ? "added" : "below";
  div.className = cls;
  div.textContent = ev.message || JSON.stringify(ev);
  const c = $("console");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  c.appendChild(div);
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function embedSrc(id) {
  // Cache-busting timestamp so the embed reloads with the playlist's current
  // tracks -- Spotify caches the embed, and reusing the same URL won't refresh.
  return "https://open.spotify.com/embed/playlist/" + id +
         "?utm_source=generator&t=" + Date.now();
}

function mountPlayer() {
  // Only mount the real embed once the playlist actually has a track --
  // an empty Spotify playlist embed renders as a broken-looking blank.
  if (playerMounted || !playlistId) return;
  $("playerWrap").innerHTML =
    '<iframe src="' + embedSrc(playlistId) + '" allow="encrypted-media" loading="lazy"></iframe>';
  playerMounted = true;
  $("refresh").disabled = false;
}

function refreshPlayer() {
  if (!playlistId) return;
  const f = document.querySelector("#playerWrap iframe");
  if (f) f.src = embedSrc(playlistId); // fresh timestamp forces a real reload
}

async function poll() {
  const r = await fetch("/api/events?cursor=" + cursor);
  const data = await r.json();
  cursor = data.cursor;
  let done = false;
  for (const ev of data.events) {
    line(ev);
    if (ev.kind === "playlist") {
      playlistId = ev.playlist_id;
      // Non-empty already (a re-run against an existing playlist) -> mount now.
      if (ev.track_count > 0) mountPlayer();
      else if (!playerMounted) renderPlayer("warming");
    }
    if (ev.kind === "reorder") showReorder(ev);
    // A new add OR a duplicate both mean the playlist has at least one track.
    if (ev.kind === "added" || ev.kind === "duplicate") mountPlayer();
    if (ev.kind === "done") { done = true; setStatus(ev.status || "complete"); }
  }
  // Fallback if the playlist id only arrives at the top level.
  if (data.playlist_id && !playlistId) {
    playlistId = data.playlist_id;
    if (!playerMounted) renderPlayer("warming");
  }
  if (done) {
    finish();
    if (playerMounted) refreshPlayer();
    else renderPlayer(emptyState);
  } else {
    setStatus(data.status);
  }
}

function setRunning(running) {
  document.querySelectorAll(".go").forEach((b) => { b.disabled = running; });
  $("stop").disabled = !running;
}

function finish() {
  clearInterval(polling); polling = null;
  setRunning(false);
}

// Shared by both modes: reset the console/player, POST the run, start polling.
async function begin(url, body, emptyKey) {
  $("console").innerHTML = ""; cursor = 0; playlistId = null; playerMounted = false;
  emptyState = emptyKey;
  renderPlayer("idle"); $("refresh").disabled = true;
  setRunning(true);
  setStatus("running");
  const r = await fetch(url, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    line({kind:"error", message:"Could not start: " + (e.detail || r.status)});
    finish(); setStatus("error"); return;
  }
  polling = setInterval(poll, 400);
}

async function start() {
  const body = {
    query: $("query").value.trim(),
    title: $("title").value.trim() || null,
    threshold: parseFloat($("threshold").value),
    spotify: $("spotify").checked,
    genius: $("genius").checked,
  };
  if (!body.query) { alert("Enter a search term first."); return; }
  await begin("/api/run", body, "empty");
}

async function startList(dryRun) {
  const body = {
    text: $("tracks").value,
    title: $("listTitle").value.trim() || null,
    dry_run: dryRun,
    known: known,   // loaded lines keep their exact track, no name search
  };
  if (!body.text.trim()) { alert("Paste some tracks first."); return; }
  if (!dryRun && !body.title) { alert("Give the playlist a title."); return; }
  await begin("/api/tracklist", body, "noPlaylist");
}

async function startReorder() {
  const text = $("tracks").value;
  if (!text.trim()) { alert("Paste some tracks first."); return; }
  collectTempos();
  $("needs").hidden = true;
  await begin("/api/reorder", {text: text, known: known, tempos: myTempos}, "noPlaylist");
}

// Read any tempos typed into the panel and remember them.
function collectTempos() {
  document.querySelectorAll("#needsRows input").forEach((input) => {
    const bpm = parseFloat(input.value);
    if (bpm > 0) myTempos[tempoKey(input.dataset.line)] = bpm;
  });
  saveTempos(myTempos);
}

// A reorder finished: put the new order in the box and ask about tracks that need a tempo.
function showReorder(ev) {
  beforeReorder = $("tracks").value;
  $("tracks").value = ev.text;
  Object.assign(known, ev.known || {});

  const rows = $("needsRows");
  rows.innerHTML = "";
  (ev.needs || []).forEach((need) => {
    const row = document.createElement("div"); row.className = "need";
    const name = document.createElement("span"); name.className = "name"; name.textContent = need.line;
    const why = document.createElement("span"); why.className = "why"; why.textContent = need.flag;
    const input = document.createElement("input");
    input.type = "number"; input.min = "30"; input.max = "300"; input.placeholder = "BPM";
    input.dataset.line = need.line;
    row.append(name, why);
    (need.readings || []).forEach((bpm) => {
      const pick = document.createElement("button");
      pick.className = "pick"; pick.textContent = "use " + bpm;
      pick.onclick = () => { input.value = bpm; };
      row.append(pick);
    });
    row.append(input);
    rows.append(row);
  });

  const count = (ev.needs || []).length, saved = Object.keys(myTempos).length;
  $("needsTitle").textContent = count
    ? count + " track(s) need a tempo from you. Enter it, then reorder again."
    : "Every track has a tempo.";
  $("applyTempos").hidden = !count;
  $("forgetTempos").hidden = !saved;
  $("temposNote").textContent = saved ? saved + " tempo(s) you entered are remembered in this browser." : "";
  $("needs").hidden = false;
}

function undoReorder() {
  if (beforeReorder !== null) $("tracks").value = beforeReorder;
  $("needs").hidden = true;
}

function forgetTempos() {
  myTempos = {}; saveTempos(myTempos);
  $("forgetTempos").hidden = true;
  $("temposNote").textContent = "Cleared. Reorder again to see the effect.";
}

// Pull an existing playlist's tracks into the box (appended, never overwriting).
async function loadPlaylist() {
  const link = $("sourceLink").value.trim();
  if (!link) { alert("Paste a playlist link first."); return; }
  $("loadList").disabled = true;
  try {
    const r = await fetch("/api/playlist-tracks", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({link}),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      line({kind:"error", message:"Could not load that playlist: " + (data.detail || r.status)});
      return;
    }
    data.tracks.forEach((t) => { if (t.id) known[t.line] = t.id; });
    const box = $("tracks");
    const existing = box.value.replace(/\s+$/, "");
    box.value = (existing ? existing + "\n" : "") + data.tracks.map((t) => t.line).join("\n");
    line({kind:"summary", message:"Loaded " + data.tracks.length + " track(s) from \""
                                   + data.name + "\" into the box. Reorder them, then create."});
  } catch (err) {
    line({kind:"error", message:"Could not load that playlist: " + err});
  } finally {
    $("loadList").disabled = false;
  }
}

function setMode(mode) {
  const list = mode === "list";
  $("searchControls").hidden = list;
  $("listControls").hidden = !list;
  $("modeSearch").classList.toggle("active", !list);
  $("modeList").classList.toggle("active", list);
}

async function stop() {
  $("stop").disabled = true;
  await fetch("/api/stop", {method: "POST"});
}

$("start").onclick = start;
$("createList").onclick = () => startList(false);
$("checkList").onclick = () => startList(true);
$("reorderList").onclick = startReorder;
$("applyTempos").onclick = startReorder;
$("undoReorder").onclick = undoReorder;
$("forgetTempos").onclick = forgetTempos;
$("loadList").onclick = loadPlaylist;
$("sourceLink").addEventListener("keydown", (e) => { if (e.key === "Enter") loadPlaylist(); });
$("modeSearch").onclick = () => setMode("search");
$("modeList").onclick = () => setMode("list");
$("stop").onclick = stop;
$("refresh").onclick = refreshPlayer;
$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

renderPlayer("idle");  // cold-start state on first load
</script>
</body>
</html>
